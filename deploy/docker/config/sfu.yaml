version: 1

instance:
  id: ${TELESRV_INSTANCE_ID}

debug:
  addr: 127.0.0.1:6064

public:
  advertise:
    ip: ${TELESRV_ADVERTISE_IP}

redis:
  addr: redis:6379
  password: ${TELESRV_REDIS_PASSWORD}
  db: 0

sfu:
  udp_port: ${TELESRV_SFU_UDP_PORT}
  advertise_ip: ${TELESRV_ADVERTISE_IP}
  instance_ttl: 90s
  instance_heartbeat_interval: 30s
  max_active_calls: 0
  control:
    addr: 0.0.0.0:2450
    url: grpc://${TELESRV_INSTANCE_ID}:2450
    token: ${TELESRV_SFU_CONTROL_TOKEN}

group_call:
  control_url: http://core:2420
  control_token: ${TELESRV_GROUPCALL_CONTROL_TOKEN}
