version: 1

instance:
  id: egress-local-a

debug:
  addr: 127.0.0.1:6062

public:
  dc: 2
  advertise:
    ip: 127.0.0.1
    port: 2398

postgres:
  dsn: ${TELESRV_POSTGRES_DSN}

redis:
  addr: 127.0.0.1:6399
  db: 0

egress:
  ack_server:
    addr: 127.0.0.1:2510
    token: ${TELESRV_EGRESS_ACK_TOKEN}
  workers: 4
  batch: 100
  lease_timeout: 30s
  outbound_push_timeout: 200ms
